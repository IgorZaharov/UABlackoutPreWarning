name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# Publishing a release fires two runs for the same tag (tag push + release published). Run them one
# after the other so they do not replace the zip at the same moment; the second just re-uploads it.
concurrency:
  group: build-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test with the .NET Framework compiler
        shell: cmd
        run: build.cmd

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: UABlackoutPreWarning
          path: out/UABlackoutPreWarning.exe
          if-no-files-found: error

      - name: Attach zip to the release (tag v* or release published on GitHub)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # README links to releases/latest/download/UABlackoutPreWarning.zip - keep this file name.
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ github.ref_name }}' }
          Compress-Archive -Path out/UABlackoutPreWarning.exe -DestinationPath out/UABlackoutPreWarning.zip -Force
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag out/UABlackoutPreWarning.zip --title $tag --generate-notes
          } else {
            gh release upload $tag out/UABlackoutPreWarning.zip --clobber
          }
