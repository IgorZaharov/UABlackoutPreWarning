name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test with the .NET Framework compiler
        shell: cmd
        run: build.cmd

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: UABlackoutPreWarning
          path: out/UABlackoutPreWarning.exe
          if-no-files-found: error

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/UABlackoutPreWarning.exe --title "${{ github.ref_name }}" --generate-notes
