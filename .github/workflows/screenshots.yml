name: screenshots

# Manual run: takes README screenshots of the real windows on a Windows runner
# (UI language from the input, dark and light themes) and uploads them as an artifact.
on:
  workflow_dispatch:
    inputs:
      culture:
        description: UI culture
        default: uk-UA

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Take screenshots
        shell: cmd
        run: tools\screenshots\shots.cmd ${{ inputs.culture }} out\screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.culture }}
          path: out/screenshots/*.png
          if-no-files-found: error

      - name: Commit screenshots to the 'screenshots' branch (for review before they go into docs/images)
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          $dir = "screenshots/${{ inputs.culture }}"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item out/screenshots/*.png $dir
          Get-ChildItem out -Recurse -File | Out-File -Encoding utf8 "$dir/files.txt"
          git checkout -B screenshots
          git add -f $dir
          git commit -m "Screenshots ${{ inputs.culture }} from run ${{ github.run_id }}"
          git push -f origin screenshots
